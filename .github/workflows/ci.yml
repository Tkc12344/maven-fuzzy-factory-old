name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run install:all
      - run: npm run lint
      - run: npm test
      - run: npm run build

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        run: docker build -t maven-fuzzy-factory:${{ github.sha }} .
      - name: Scan image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: maven-fuzzy-factory:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        if: github.event_name == 'push'
        run: |
          IMAGE=ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker tag maven-fuzzy-factory:${{ github.sha }} "$IMAGE"
          docker push "$IMAGE"
