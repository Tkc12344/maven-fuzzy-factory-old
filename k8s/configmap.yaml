apiVersion: v1
kind: ConfigMap
metadata:
  name: mff-config
  namespace: maven-fuzzy-factory
data:
  NODE_ENV: production
  PORT: "4000"
  DATA_DIR: /data
  WAREHOUSE_DIR: /var/lib/mff/warehouse
  CLIENT_DIR: /app/client/dist
  LLM_PROVIDER: auto
  CORS_ORIGIN: "https://fuzzy-factory.local"
  ALERT_CRON: "0 * * * *"
